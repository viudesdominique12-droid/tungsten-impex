# -----------------------------------------------------------------------------
# Publication sur GitHub Pages.
#
# Le site est construit puis deploye a chaque poussee sur master. Rien n'est
# commite dans le depot : dist/ reste ignore, l'artefact est fabrique ici.
#
# LE SOUS-CHEMIN VIENT DE L'ADRESSE PUBLIQUE, PLUS DU NOM DU DEPOT.
#
# Il etait deduit du nom du depot : depot « tungsten-impex » donc base
# « /tungsten-impex/ ». Juste tant que le site vit sur une page de projet, faux
# le jour ou un nom de domaine est branche sur ce meme depot : GitHub Pages sert
# alors l'artefact a la RACINE du domaine, alors qu'il reste bati pour le
# sous-chemin. Mesure sur les dix-neuf pages publiees : 1224 adresses — la
# feuille de style, les quatre fontes, 183 images et 878 liens — pointeraient
# une case trop loin. Site sans style, sans photo, navigation morte, et aucune
# etape en echec.
#
# La source de l'adresse publique est UNE SEULE : src/data/site.json, cle
# web.canonique. Son chemin donne le sous-chemin, son origine donne le domaine.
# Le commentaire de ce fichier-la promettait deja « la seule ligne a modifier » ;
# c'est desormais vrai.
# -----------------------------------------------------------------------------
name: Publier sur GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication a la fois, et on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # L'adresse publique est lue dans le depot, pas deduite de son nom, et pas
      # posee dans une variable de l'interface GitHub : elle doit rester visible
      # et versionnee avec le code qu'elle gouverne.
      - name: Determiner l'adresse de publication
        id: adresse
        run: |
          canonique="$(node -p "require('./src/data/site.json').web.canonique")"
          base="$(node -p "new URL(process.argv[1]).pathname" "$canonique")"
          site="$(node -p "new URL(process.argv[1]).origin" "$canonique")"
          case "$base" in */) ;; *) base="$base/" ;; esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "publie sous $site$base (source : src/data/site.json, web.canonique)"

      - name: Construire
        env:
          BASE_PATH: ${{ steps.adresse.outputs.base }}
          SITE_URL: ${{ steps.adresse.outputs.site }}
        run: npm run build

      # LE GARDE-FOU, REPARE. L'ancien cherchait les adresses restees HORS du
      # sous-chemin : il verifiait qu'elles PORTENT le prefixe, jamais que le
      # prefixe soit le BON — plus le prefixe etait faux, plus il etait content.
      # Rejoue sur un artefact entierement bati pour l'ancien prefixe, il rend
      # zero reste et passe au vert. Il sautait aussi robots.txt et sitemap.xml,
      # ou un canonique perime survivait sans que rien ne bronche.
      # Le raisonnement complet est dans outils/verifier-publication.mjs.
      - name: Verifier que l'artefact correspond a l'adresse de publication
        env:
          BASE_PATH: ${{ steps.adresse.outputs.base }}
          CI: '1'
        run: node outils/verifier-publication.mjs


      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
